document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.m-grid2{grid-template-columns:1fr!important}\n  .m-pad{padding:44px 20px!important}\n  .m-navpad{padding:12px 20px!important}\n}\n@media (max-width:720px){\n  .m-navlink{display:none!important}\n  .m-navcta{padding:7px 14px!important;font-size:13px!important;box-shadow:2px 2px 0 #17141f!important}\n  .m-burger{display:flex!important}\n  .m-thread{margin:-12px 0 0 16px!important}\n}<\u002Fstyle><\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#fff\">\n  <div style=\"position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:2px solid #17141f\">\n    <div class=\"m-navpad\" style=\"max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 32px\">\n      <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;color:#17141f\">\n        <span style=\"width:32px;height:32px;background:#6c3df4;border-radius:10px 10px 10px 2px;display:flex;align-items:center;justify-content:center\">\n          <span style=\"display:block;width:13px;height:4px;background:#ffd803;border-radius:2px\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:20px;font-weight:700;letter-spacing:-.02em\">marginalia<\u002Fspan>\n      <\u002Fa>\n      <div style=\"display:flex;align-items:center;gap:22px;font-size:14px;font-weight:600\">\n        <a class=\"m-navlink\" href=\"#install\" style=\"color:#4c4661\" style-hover=\"color:#6c3df4\">Install<\u002Fa>\n        <a class=\"m-navlink\" href=\"#use\" style=\"color:#4c4661\" style-hover=\"color:#6c3df4\">How to use<\u002Fa>\n        <a class=\"m-navlink\" href=\"#configure\" style=\"color:#4c4661\" style-hover=\"color:#6c3df4\">Configure<\u002Fa>\n        <a class=\"m-navlink\" href=\"https://github.com/midhunkrishna/marginalia\" style=\"color:#4c4661\" style-hover=\"color:#6c3df4\">GitHub ↗<\u002Fa>\n        <a class=\"m-navcta\" href=\"https://chromewebstore.google.com/detail/marginalia/lkondngonkokanegbiaphkjehphhjdha\" style=\"background:#6c3df4;color:#fff;padding:10px 19px;border-radius:999px;box-shadow:3px 3px 0 #17141f\">＋ Add to Chrome<\u002Fa>\n        <button class=\"m-burger\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"display:none;align-items:center;justify-content:center;width:44px;height:44px;background:#fff;border:2px solid #17141f;border-radius:12px;font-size:18px;cursor:pointer;color:#17141f;padding:0\">{{ burgerIcon }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;background:#fff;border-bottom:2px solid #17141f\">\n        <a href=\"#install\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"padding:16px 20px;font-size:16px;font-weight:600;color:#17141f;border-bottom:1px solid #e2ddf2\">Install<\u002Fa>\n        <a href=\"#use\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"padding:16px 20px;font-size:16px;font-weight:600;color:#17141f;border-bottom:1px solid #e2ddf2\">How to use<\u002Fa>\n        <a href=\"#configure\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"padding:16px 20px;font-size:16px;font-weight:600;color:#17141f;border-bottom:1px solid #e2ddf2\">Configure<\u002Fa>\n        <a href=\"https://github.com/midhunkrishna/marginalia\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"padding:16px 20px;font-size:16px;font-weight:600;color:#17141f\">GitHub ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div id=\"top\" class=\"m-hero\" style=\"max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;padding:60px 32px;align-items:center\">\n    <div>\n      <h1 class=\"m-h1\" style=\"font-size:54px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:0;text-wrap:balance\">Stop scrolling away from <span style=\"background:#ffd803;padding:0 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone\">the good part.<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.55;color:#4c4661;margin:20px 0 28px;max-width:440px;text-wrap:pretty\">Comment threads for ChatGPT, Claude &amp; Gemini — like Google Docs, but for AI answers. Highlight it, ask about it, right there in the margin.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n        <a href=\"https://chromewebstore.google.com/detail/marginalia/lkondngonkokanegbiaphkjehphhjdha\" style=\"background:#17141f;color:#fff;padding:16px 28px;border-radius:14px;font-weight:700;font-size:16px;box-shadow:4px 4px 0 #6c3df4\">Add to Chrome — free<\u002Fa>\n        <div style=\"font-size:13px;line-height:1.4;color:#4c4661\">Free forever<br>Open source 🔓<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;margin-top:26px;flex-wrap:wrap\">\n        <span style=\"border:2px solid #17141f;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600\">ChatGPT<\u002Fspan>\n        <span style=\"border:2px solid #17141f;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600\">Claude<\u002Fspan>\n        <span style=\"border:2px solid #17141f;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600\">Gemini<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative\">\n      <div style=\"background:#f4f2fb;border:2px solid #17141f;border-radius:16px;padding:24px 26px;font-size:14.5px;line-height:1.65;color:#33304a\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:#8d86a8;margin-bottom:10px\">CHATGPT · LONG ANSWER<\u002Fdiv>\n        …the deposit is refundable only if you cancel within the <mark style=\"background:#ffd803;padding:1px 3px;border-radius:4px;font-weight:600\">statutory cooling-off period<\u002Fmark>, which varies by state. After that window closes, the landlord may retain…\n        <div style=\"margin-top:12px;height:7px;background:#e2ddf2;border-radius:4px;width:90%\"><\u002Fdiv>\n        <div style=\"margin-top:7px;height:7px;background:#e2ddf2;border-radius:4px;width:64%\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-thread\" style=\"position:relative;margin:-18px 0 0 60px;background:#fff;border:2px solid #17141f;border-radius:14px;padding:16px 18px;box-shadow:5px 5px 0 #ffd803;max-width:330px\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:#6c3df4;margin-bottom:7px\">💬 YOUR MARGIN THREAD<\u002Fdiv>\n        <div style=\"font-size:13.5px;font-weight:700\">wait — how long is that in California?<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.5;color:#4c4661;margin-top:8px\">In California it's 3 business days for most contracts (Civil Code §1689.5) — some door-to-door sales get 5.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"install\" style=\"background:#6c3df4;color:#fff;scroll-margin-top:80px\">\n    <div class=\"m-pad\" style=\"max-width:1080px;margin:0 auto;padding:52px 32px\">\n      <h2 style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 24px\">Install in ten seconds ⚡<\u002Fh2>\n      <div class=\"m-grid3\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n        <div style=\"background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:22px 24px\">\n          <div style=\"width:32px;height:32px;background:#ffd803;color:#17141f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px\">1<\u002Fdiv>\n          <div style=\"font-weight:700;font-size:16px;margin:12px 0 5px\">Open the Web Store<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.55;color:#d9d0fb\">Go to <a href=\"https://chromewebstore.google.com/detail/marginalia/lkondngonkokanegbiaphkjehphhjdha\" style=\"color:#ffd803\">Marginalia's listing<\u002Fa> — free, no account needed.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:22px 24px\">\n          <div style=\"width:32px;height:32px;background:#ffd803;color:#17141f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px\">2<\u002Fdiv>\n          <div style=\"font-weight:700;font-size:16px;margin:12px 0 5px\">Click \"Add to Chrome\"<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.55;color:#d9d0fb\">Confirm with \"Add extension\". That's the whole setup.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:22px 24px\">\n          <div style=\"width:32px;height:32px;background:#ffd803;color:#17141f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px\">3<\u002Fdiv>\n          <div style=\"font-weight:700;font-size:16px;margin:12px 0 5px\">Open a chat<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.55;color:#d9d0fb\">Visit chatgpt.com, claude.ai or gemini.google.com and highlight any text in an answer.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"use\" class=\"m-pad\" style=\"max-width:1080px;margin:0 auto;padding:56px 32px;scroll-margin-top:80px\">\n    <h2 style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px\">How to use it<\u002Fh2>\n    <p style=\"font-size:15px;color:#4c4661;margin:0 0 30px;max-width:560px\">Highlight any phrase in an AI answer and a comment box opens beside it. <span style=\"background:#ffd803;padding:0 5px;border-radius:4px;font-weight:600\">That's it.<\u002Fspan><\u002Fp>\n    <div class=\"m-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/selection.png\" alt=\"Highlighting text opens a comment box\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #e2ddf2\">\n        <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">Ask about a selection.<\u002Fstrong> Highlight the phrase you're unsure about and type your question in the margin.<\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n        <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/response.png\" alt=\"The reply streams into the margin thread\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #e2ddf2\">\n        <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">Read the reply in place.<\u002Fstrong> The answer streams into the thread — the text you were reading never scrolls away.<\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px;grid-column:1 / -1\">\n        <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/another.png\" alt=\"A second question minimizes other threads\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #e2ddf2\">\n        <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">Ask as many as you like.<\u002Fstrong> Starting another question on the same chat minimizes the other threads and focuses the new selection.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"configure\" style=\"background:#f4f2fb;border-top:2px solid #17141f;scroll-margin-top:80px\">\n    <div class=\"m-pad\" style=\"max-width:1080px;margin:0 auto;padding:56px 32px\">\n      <h2 style=\"font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px\">Configure 🔧<\u002Fh2>\n      <p style=\"font-size:15px;color:#4c4661;margin:0 0 30px;max-width:620px\">Logged into Claude or Gemini? It just works — zero setup. Prefer API keys? Add them on the settings page.<\u002Fp>\n      <div class=\"m-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n        <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n          <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/settings.png\" alt=\"Marginalia settings page\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #ffd803\">\n          <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">The settings page<\u002Fstrong> is where you set up API keys. Without keys, it uses the chat app you're already signed into (Claude and Gemini).<\u002Ffigcaption>\n        <\u002Ffigure>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/manage_conversations.png\" alt=\"Manage Conversation menu in the corner\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #ffd803\">\n            <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">Find the menu.<\u002Fstrong> Every conversation has a \"Manage Conversation\" menu in the bottom-right corner.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0;display:flex;flex-direction:column;gap:10px\">\n            <img src=\"https://github.com/midhunkrishna/marginalia/raw/master/images/go_to_settings.png\" alt=\"Opening settings from the menu\" style=\"width:100%;border:2px solid #17141f;border-radius:14px;box-shadow:5px 5px 0 #ffd803\">\n            <figcaption style=\"font-size:13.5px;line-height:1.5;color:#4c4661\"><strong style=\"color:#17141f\">Open Settings<\u002Fstrong> from there to manage keys and preferences.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#17141f;color:#fff\">\n    <div class=\"m-pad\" style=\"max-width:1080px;margin:0 auto;padding:52px 32px;text-align:center\">\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;text-wrap:balance\">Your next \"wait, what?\" deserves a margin.<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.6;color:#a89fc4;max-width:520px;margin:0 auto 24px\">No server, no tracking. Threads live in your browser; questions go only to your AI. <a href=\"https://github.com/midhunkrishna/marginalia\" style=\"color:#ffd803\">Check the code yourself<\u002Fa>.<\u002Fdiv>\n      <a href=\"https://chromewebstore.google.com/detail/marginalia/lkondngonkokanegbiaphkjehphhjdha\" style=\"display:inline-block;background:#ffd803;color:#17141f;padding:16px 32px;border-radius:14px;font-weight:700;font-size:16px;border:2px solid #fff;box-shadow:4px 4px 0 #6c3df4\">Add to Chrome — 10 seconds, no account<\u002Fa>\n      <div style=\"display:flex;justify-content:center;gap:20px;font-size:12.5px;color:#8d86a8;margin-top:32px\">\n        <span>© 2026 Marginalia<\u002Fspan>\n        <a href=\"https://github.com/midhunkrishna/marginalia\" style=\"color:#8d86a8\">GitHub<\u002Fa>\n        <a href=\"https://chromewebstore.google.com/detail/marginalia/lkondngonkokanegbiaphkjehphhjdha\" style=\"color:#8d86a8\">Chrome Web Store<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { menuOpen: false };\n  renderVals() {\n    return {\n      menuOpen: this.state.menuOpen,\n      burgerIcon: this.state.menuOpen ? '✕' : '☰',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
